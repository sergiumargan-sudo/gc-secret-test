# Ground Cyber closure audit — dogfood run for this repository.
#
# Scoped to secret-scanning alerts. The default Actions GITHUB_TOKEN cannot
# read secret-scanning or Dependabot alerts (confirmed by run #1: 403), so
# this uses a fine-grained PAT stored as the GC_AUDIT_TOKEN repo secret with
# "Secret scanning alerts: read" on this repository only.

name: Ground Cyber Closure Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ground Cyber
        uses: sergiumargan-sudo/ground-cyber-plugin@main
        with:
          alerts: "secret-scanning"
          output: "markdown,json"
          fail-on-gcs3: "false"
          fail-on-gcs4: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GC_AUDIT_TOKEN }}
